name: One-shot add custom domain group

on:
  push:
    paths:
      - .github/workflows/one-shot-add-custom-domain.yml

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch synchronized configs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          DOMAIN = "choner.eu.org"
          GROUP = "自有域名"

          def insert_after_exact(text, marker, additions, label):
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.rstrip("\r\n") == marker:
                      lines[i + 1:i + 1] = additions
                      return "".join(lines)
              raise SystemExit(f"marker not found in {label}: {marker}")

          def insert_yaml_group(text, choices, label):
              if f"- name: {GROUP}\n" in text:
                  return text
              lines = text.splitlines(keepends=True)
              start = next((i for i, x in enumerate(lines) if x.rstrip("\r\n") == "- name: 链式落地"), None)
              if start is None:
                  raise SystemExit(f"链式落地 not found in {label}")
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  raw = lines[i].rstrip("\r\n")
                  if raw.startswith("- name: ") or raw in ("rules:", "rule-providers:"):
                      end = i
                      break
              group = [f"- name: {GROUP}\n", "  type: select\n", "  proxies:\n"]
              group.extend(f"  - {x}\n" for x in choices)
              lines[end:end] = group
              return "".join(lines)

          def patch_yaml(path, choices):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              rule = f"- DOMAIN-SUFFIX,{DOMAIN},{GROUP}"
              if rule not in text:
                  text = insert_after_exact(text, "- GEOIP,private,全球直连,no-resolve", [rule + "\n"], path)
              text = insert_yaml_group(text, choices, path)
              p.write_text(text, encoding="utf-8")

          def patch_ini(path, choices):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              rule = f"ruleset={GROUP},[]DOMAIN-SUFFIX,{DOMAIN}"
              if rule not in text:
                  text = insert_after_exact(text, "ruleset=全球直连,[]GEOIP,private,no-resolve", ["; 自有域名及其全部子域名独立分流\n", rule + "\n"], path)
              group = f"custom_proxy_group={GROUP}`select`" + "`".join(f"[]{x}" for x in choices)
              if f"custom_proxy_group={GROUP}`select`" not in text:
                  text = insert_after_exact(text, "custom_proxy_group=链式落地`select`小鸡", [group + "\n"], path)
              p.write_text(text, encoding="utf-8")

          full = ["手动选择", "手动选择2", "手动选择3", "全球直连", "♻️ 自动选择", "香港节点", "美国节点", "链式落地", "日本节点", "新加坡节点", "台湾节点", "韩国节点", "加拿大节点", "英国节点", "法国节点", "德国节点", "荷兰节点", "土耳其节点", "俄罗斯节点", "其他地区", "家宽节点", "低倍率节点"]
          lite = ["手动选择", "手动选择2", "手动选择3", "全球直连", "♻️ 自动选择", "香港节点", "美国节点", "日本节点", "新加坡节点", "台湾节点", "韩国节点", "链式落地"]

          patch_yaml("config/OpenClash_Full.yaml", full)
          patch_yaml("config/OpenClash_Lite.yaml", lite)
          patch_ini("config/OpenClash_Full.ini", full)
          patch_ini("config/OpenClash_Lite.ini", lite)

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          if "## 自有域名策略\n" not in text:
              parts = ["## 自有域名策略", "- Full / Lite 均提供 `自有域名` 策略组。", "- `DOMAIN-SUFFIX,choner.eu.org` 会匹配 `choner.eu.org` 本身及其全部子域名，并在较高优先级进入 `自有域名`，避免落入 `漏网之鱼`。", "- `自有域名` 默认优先选择 `手动选择`，也可独立切换 `全球直连`、自动选择、地区节点或 `链式落地`。", "## 同步维护要求", "- **同一版本的 YAML 与 INI 必须同步修改。**", "- Full / Lite 各自保持规则顺序、策略组名称、默认候选顺序和节点筛选逻辑对应，禁止只修改一种格式。"]
              text = text.rstrip() + "\n\n" + "\n\n".join(parts) + "\n"
          p.write_text(text, encoding="utf-8")

          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          if "### 新增自有域名独立策略组\n" not in text:
              items = ["### 新增自有域名独立策略组", "- Full / Lite 均新增 `自有域名` 策略组。", "- 新增高优先级规则 `DOMAIN-SUFFIX,choner.eu.org,自有域名`，覆盖 `choner.eu.org` 本身及其全部子域名，避免继续落入 `漏网之鱼`。", "- `自有域名` 默认优先选择 `手动选择`，同时可独立切换 `全球直连`、自动选择、地区节点和 `链式落地`。", "- Full / Lite 的 YAML 与 INI 已同步更新。", "- 新增长期维护要求：同一版本的 YAML / INI 必须同步修改，禁止只改其中一种格式。", "- 更新后 Full 为 55 个策略组、51 条分流规则；Lite 为 24 个策略组、27 条分流规则。"]
              section = "\n\n".join(items) + "\n\n"
              marker = "## 2026-09-18\n\n"
              text = text.replace(marker, marker + section, 1) if marker in text else "## 2026-09-18\n\n" + section + text
          p.write_text(text, encoding="utf-8")
          PY

      - name: Validate synchronized changes
        shell: bash
        run: |
          set -euo pipefail
          for f in config/OpenClash_Full.yaml config/OpenClash_Lite.yaml; do
            test "$(grep -c '^- name: 自有域名$' "$f")" -eq 1
            test "$(grep -c '^- DOMAIN-SUFFIX,choner.eu.org,自有域名$' "$f")" -eq 1
          done
          for f in config/OpenClash_Full.ini config/OpenClash_Lite.ini; do
            test "$(grep -c '^ruleset=自有域名,\[\]DOMAIN-SUFFIX,choner.eu.org$' "$f")" -eq 1
            test "$(grep -c '^custom_proxy_group=自有域名`select`' "$f")" -eq 1
          done
          git diff --check

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/OpenClash_Full.yaml config/OpenClash_Lite.yaml config/OpenClash_Full.ini config/OpenClash_Lite.ini README.md CHANGELOG.md
          git rm .github/workflows/one-shot-add-custom-domain.yml
          git commit -m "config: add custom domain strategy group"
          git push
