name: One-shot add custom domain group

on:
  push:
    paths:
      - .github/workflows/one-shot-add-custom-domain.yml

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Full/Lite YAML and INI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          DOMAIN = "choner.eu.org"
          GROUP = "自有域名"

          def insert_after_line(text, marker, addition, label):
              if addition.strip() in text:
                  return text
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.rstrip("\r\n") == marker:
                      lines.insert(i + 1, addition)
                      return "".join(lines)
              raise SystemExit(f"marker not found: {label}: {marker}")

          def insert_group_after_yaml_group(text, after_name, group_text, label):
              if f"- name: {GROUP}\n" in text:
                  return text
              lines = text.splitlines(keepends=True)
              start = None
              for i, line in enumerate(lines):
                  if line.rstrip("\r\n") == f"- name: {after_name}":
                      start = i
                      break
              if start is None:
                  raise SystemExit(f"group not found: {label}: {after_name}")
              end = len(lines)
              for j in range(start + 1, len(lines)):
                  raw = lines[j].rstrip("\r\n")
                  if raw.startswith("- name: ") or raw == "rules:" or raw == "rule-providers:":
                      end = j
                      break
              lines.insert(end, group_text)
              return "".join(lines)

          def patch_yaml(path, full):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text = insert_after_line(
                  text,
                  "- GEOIP,private,全球直连,no-resolve",
                  f"- DOMAIN-SUFFIX,{DOMAIN},{GROUP}\n",
                  path,
              )
              if full:
                  choices = [
                      "手动选择", "手动选择2", "手动选择3", "全球直连", "♻️ 自动选择",
                      "香港节点", "美国节点", "链式落地", "日本节点", "新加坡节点",
                      "台湾节点", "韩国节点", "加拿大节点", "英国节点", "法国节点",
                      "德国节点", "荷兰节点", "土耳其节点", "俄罗斯节点", "其他地区",
                      "家宽节点", "低倍率节点",
                  ]
              else:
                  choices = [
                      "手动选择", "手动选择2", "手动选择3", "全球直连", "♻️ 自动选择",
                      "香港节点", "美国节点", "日本节点", "新加坡节点", "台湾节点",
                      "韩国节点", "链式落地",
                  ]
              group_text = f"- name: {GROUP}\n  type: select\n  proxies:\n" + "".join(f"  - {x}\n" for x in choices)
              text = insert_group_after_yaml_group(text, "链式落地", group_text, path)
              p.write_text(text, encoding="utf-8")

          def patch_ini(path, full):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              rule = f"; 自有域名及其全部子域名独立分流\nruleset={GROUP},[]DOMAIN-SUFFIX,{DOMAIN}\n"
              if f"ruleset={GROUP},[]DOMAIN-SUFFIX,{DOMAIN}" not in text:
                  text = insert_after_line(
                      text,
                      "ruleset=全球直连,[]GEOIP,private,no-resolve",
                      rule,
                      path,
                  )
              if full:
                  choices = [
                      "手动选择", "手动选择2", "手动选择3", "全球直连", "♻️ 自动选择",
                      "香港节点", "美国节点", "链式落地", "日本节点", "新加坡节点",
                      "台湾节点", "韩国节点", "加拿大节点", "英国节点", "法国节点",
                      "德国节点", "荷兰节点", "土耳其节点", "俄罗斯节点", "其他地区",
                      "家宽节点", "低倍率节点",
                  ]
              else:
                  choices = [
                      "手动选择", "手动选择2", "手动选择3", "全球直连", "♻️ 自动选择",
                      "香港节点", "美国节点", "日本节点", "新加坡节点", "台湾节点",
                      "韩国节点", "链式落地",
                  ]
              group_line = f"custom_proxy_group={GROUP}`select`" + "`".join(f"[]{x}" for x in choices) + "\n"
              if f"custom_proxy_group={GROUP}`select`" not in text:
                  text = insert_after_line(text, "custom_proxy_group=链式落地`select`小鸡", group_line, path)
              p.write_text(text, encoding="utf-8")

          patch_yaml("config/OpenClash_Full.yaml", True)
          patch_yaml("config/OpenClash_Lite.yaml", False)
          patch_ini("config/OpenClash_Full.ini", True)
          patch_ini("config/OpenClash_Lite.ini", False)

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          section = """

## 自有域名策略

- Full / Lite 均提供 `自有域名` 策略组。
- `DOMAIN-SUFFIX,choner.eu.org` 会匹配 `choner.eu.org` 本身及其全部子域名，并在较高优先级进入 `自有域名`，避免落入 `漏网之鱼`。
- `自有域名` 默认优先选择 `手动选择`，也可独立切换 `全球直连`、自动选择、地区节点或 `链式落地`。

## 同步维护要求

- **同一版本的 YAML 与 INI 必须同步修改。**
- Full / Lite 各自保持规则顺序、策略组名称、默认候选顺序和节点筛选逻辑对应，禁止只修改一种格式。
"""
          if "## 自有域名策略\n" not in text:
              text = text.rstrip() + section + "\n"
          p.write_text(text, encoding="utf-8")

          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          section = """### 新增自有域名独立策略组

- Full / Lite 均新增 `自有域名` 策略组。
- 新增高优先级规则 `DOMAIN-SUFFIX,choner.eu.org,自有域名`，覆盖 `choner.eu.org` 本身及其全部子域名，避免继续落入 `漏网之鱼`。
- `自有域名` 默认优先选择 `手动选择`，同时可独立切换 `全球直连`、自动选择、地区节点和 `链式落地`。
- Full / Lite 的 YAML 与 INI 已同步更新。
- 新增长期维护要求：同一版本的 YAML / INI 必须同步修改，禁止只改其中一种格式。
- 更新后 Full 为 55 个策略组、51 条分流规则；Lite 为 24 个策略组、27 条分流规则。

"""
          if "### 新增自有域名独立策略组\n" not in text:
              marker = "## 2026-09-18\n\n"
              if marker in text:
                  text = text.replace(marker, marker + section, 1)
              else:
                  text = "## 2026-09-18\n\n" + section + text
          p.write_text(text, encoding="utf-8")
          PY

      - name: Validate synchronized changes
        shell: bash
        run: |
          set -euo pipefail
          for f in config/OpenClash_Full.yaml config/OpenClash_Lite.yaml; do
            test "$(grep -c '^- name: 自有域名$' "$f")" -eq 1
            test "$(grep -c '^- DOMAIN-SUFFIX,choner.eu.org,自有域名$' "$f")" -eq 1
          done
          for f in config/OpenClash_Full.ini config/OpenClash_Lite.ini; do
            test "$(grep -c '^ruleset=自有域名,\[\]DOMAIN-SUFFIX,choner.eu.org$' "$f")" -eq 1
            test "$(grep -c '^custom_proxy_group=自有域名`select`' "$f")" -eq 1
          done
          git diff --check

      - name: Commit synchronized update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/OpenClash_Full.yaml config/OpenClash_Lite.yaml config/OpenClash_Full.ini config/OpenClash_Lite.ini README.md CHANGELOG.md
          git rm .github/workflows/one-shot-add-custom-domain.yml
          git commit -m "config: add custom domain strategy group"
          git push
